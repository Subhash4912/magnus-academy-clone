<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local iframe demonstration</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, sans-serif;
        background: #eef2ff;
        color: #312e81;
      }
      .card {
        padding: 20px;
        border: 1px solid #c7d2fe;
        border-radius: 14px;
        background: white;
        box-shadow: 0 8px 24px #312e8120;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Local iframe content</h1>
      <p>
        This standalone file loads inside the React application without relying
        on an external website.
      </p>
    </main>
  </body>
</html>
